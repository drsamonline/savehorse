name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The crates were renamed from shavehorse-* to savehorse-* early on.
      # A stale import reads as a missing crate and wastes a whole CI run,
      # so it fails here first, with a message that says what to do.
      - name: No stale crate names
        shell: bash
        run: |
          if grep -rn "shavehorse" --include=*.rs --include=*.toml .; then
            echo "::error::The crates are savehorse-*, not shavehorse-*. Fix the imports above."
            exit 1
          fi

      - name: Build
        run: cargo build --workspace --all-targets --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Smoke test the CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -- --version
          cargo run --quiet -- modules
          cargo run --quiet -- ops sift
          mkdir -p smoke/nested
          printf 'alpha beta\nsecond line alpha\n' > smoke/a.txt
          printf 'alpha beta\nsecond line alpha\n' > smoke/nested/copy.txt
          printf 'nothing here\n' > smoke/b.txt
          cargo run --quiet -- sift search alpha smoke
          cargo run --quiet -- sift strings smoke/a.txt --min-len 4
          cargo run --quiet -- sift replace beta gamma smoke --dry-run
          cargo run --quiet -- scout catalog smoke --format json
          cargo run --quiet -- scout duplicates smoke
          cargo run --quiet -- scout clean smoke

          # glyph
          printf '# Title\n\nSome **bold** text.\n\n- one\n- two\n' > smoke/doc.md
          cargo run --quiet -- glyph markdown smoke/doc.md --out smoke/doc.html
          test -s smoke/doc.html
          printf 'first line\nsecond line\n' > smoke/text.txt
          cargo run --quiet -- glyph pdf smoke/text.txt --out smoke/text.pdf --title "Smoke Test"
          test -s smoke/text.pdf
          cargo run --quiet -- glyph extract smoke/text.pdf
          cargo run --quiet -- glyph encoding smoke/text.txt
          cargo run --quiet -- glyph readability smoke/text.txt
          cargo run --quiet -- glyph metrics smoke/text.txt

          # halo
          mkdir -p smoke/iso
          printf 'hello iso\n' > smoke/iso/readme.txt
          printf 'payload\n' > smoke/iso/notes.txt
          cargo run --quiet -- halo create smoke/iso --out smoke/test.iso --volume-id SMOKE
          cargo run --quiet -- halo list smoke/test.iso
          cargo run --quiet -- halo verify smoke/test.iso
          cargo run --quiet -- halo extract smoke/test.iso --out smoke/extracted
          test -f smoke/extracted/README.TXT
          grep -q 'hello iso' smoke/extracted/README.TXT

          # iris — a 1x1 PNG, decoded from base64 so the test needs no fixtures
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > smoke/px.png
          cargo run --quiet -- iris info smoke/px.png
          cargo run --quiet -- iris convert smoke/px.png --out smoke/px.bmp
          test -s smoke/px.bmp
          cargo run --quiet -- iris thumb smoke/px.png --out smoke/thumb.png --width 1 --height 1
          cargo run --quiet -- iris transform smoke/px.png --out smoke/rot.png --rotate 90
          cargo run --quiet -- iris stats smoke/px.png
          mkdir -p smoke/imgout
          cargo run --quiet -- iris batch smoke --out smoke/imgout --format bmp
          test -s smoke/imgout/px.bmp

          # arc
          cargo run --quiet -- arc create smoke/iso --out smoke/tree.zip
          cargo run --quiet -- arc list smoke/tree.zip
          cargo run --quiet -- arc test smoke/tree.zip
          cargo run --quiet -- arc extract smoke/tree.zip --out smoke/unzipped
          test -f smoke/unzipped/iso/readme.txt
          cargo run --quiet -- arc split smoke/test.iso --size 16k --out smoke/parts
          cargo run --quiet -- arc join smoke/parts/test.iso.manifest.json --out smoke/rejoined.iso
          cmp smoke/test.iso smoke/rejoined.iso

          # revive — carve a PNG out of a blob, then snapshot and restore
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > smoke/carve_src.png
          head -c 200 /dev/zero > smoke/blob.bin
          cat smoke/carve_src.png >> smoke/blob.bin
          cargo run --quiet -- revive scan smoke/blob.bin
          cargo run --quiet -- revive report smoke/blob.bin
          cargo run --quiet -- revive carve smoke/blob.bin --out smoke/carved
          ls smoke/carved | grep -q 'carved_0001'
          cargo run --quiet -- revive pack smoke/iso --out smoke/snap.chronos
          cargo run --quiet -- revive verify smoke/snap.chronos
          cargo run --quiet -- revive unpack smoke/snap.chronos --out smoke/restored
          grep -q 'hello iso' smoke/restored/readme.txt
          cargo run --quiet -- revive geometry smoke/test.iso

          # sift text half
          printf 'line one\nline two  \n\n\nline three\n' > smoke/messy.txt
          cargo run --quiet -- sift view smoke/messy.txt --numbers
          cargo run --quiet -- sift stats smoke/messy.txt
          cargo run --quiet -- sift eol smoke/messy.txt
          cargo run --quiet -- sift clean smoke/messy.txt --strip-trailing --collapse-blank
          cargo run --quiet -- sift clean smoke/messy.txt --strip-trailing --collapse-blank --in-place
          cargo run --quiet -- sift convert smoke/messy.txt --to utf8-bom --out smoke/messy-bom.txt
          test -s smoke/messy-bom.txt

          # forge
          cargo run --quiet -- forge hexdump smoke/px.png --length 32
          cargo run --quiet -- forge search smoke/px.png --hex "89504E47"
          cargo run --quiet -- forge patch smoke/px.png --offset 0 --hex "89504E47" --dry-run
          if cargo run --quiet -- forge inspect smoke/px.png 2>err2.txt; then
            echo "a PNG must not pass as a PE"
            exit 1
          fi

          # morph
          mkdir -p smoke/ren
          printf 'x' > smoke/ren/one.txt
          printf 'y' > smoke/ren/two.txt
          cargo run --quiet -- morph rename smoke/ren --case upper --dry-run
          test -f smoke/ren/one.txt
          cargo run --quiet -- morph rename smoke/ren --case upper --journal smoke/ren/journal.json
          test -f smoke/ren/ONE.TXT
          cargo run --quiet -- morph undo smoke/ren/journal.json
          test -f smoke/ren/one.txt

          # a planned operation must refuse, and say why
          if cargo run --quiet -- aegis shred smoke/text.txt 2>err.txt; then
            echo "planned operation should have failed"
            exit 1
          fi
          grep -q "not ported yet" err.txt

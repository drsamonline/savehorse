name: Desktop

on:
  push:
    branches: [ main ]
    paths:
      - "apps/savehorse-desktop/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "apps/savehorse-desktop/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # The front end type-checks and builds on its own. This job needs nothing
  # from Tauri, so it is fast and fails for reasons that are easy to read.
  ui:
    name: ui build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/savehorse-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/savehorse-desktop/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Fail if the build produced nothing
        run: test -f dist/index.html

      # The static demo in demo/ is a build of this app. If the app or the
      # registry changed and the demo was not rebuilt, the published page is
      # showing an older interface than the source.
      - name: Demo is up to date
        working-directory: .
        run: |
          bash scripts/build-demo.sh
          if ! git diff --quiet -- demo docs/play; then
            echo "::error::demo/ or docs/play is out of date. Run scripts/build-demo.sh and commit the result."
            git --no-pager diff --stat -- demo docs/play
            exit 1
          fi

  # The Rust shell needs system libraries that the CLI does not, so it is
  # checked separately rather than slowing the main build down.
  shell:
    name: tauri shell (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install webkit and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/savehorse-desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/savehorse-desktop/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('apps/savehorse-desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      # Tauri embeds the front-end build at compile time, so it has to exist
      # before cargo looks at the shell.
      - name: Build the front end
        working-directory: apps/savehorse-desktop
        run: |
          npm ci
          npm run build

      - name: Check the shell
        run: cargo check --manifest-path apps/savehorse-desktop/src-tauri/Cargo.toml

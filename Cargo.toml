[workspace]
resolver = "2"
members = [
    "crates/savehorse-core",
    "crates/savehorse-registry",
    "crates/savehorse-sift",
    "crates/savehorse-scout",
    "crates/savehorse-runner",
    "crates/savehorse-glyph",
    "crates/savehorse-halo",
    "apps/savehorse-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/drsamonline/savehorse"
authors = ["Dr Sohil Momin"]

[workspace.dependencies]
savehorse-core = { path = "crates/savehorse-core" }
savehorse-registry = { path = "crates/savehorse-registry" }
savehorse-sift = { path = "crates/savehorse-sift" }
savehorse-scout = { path = "crates/savehorse-scout" }
savehorse-runner = { path = "crates/savehorse-runner" }
savehorse-glyph = { path = "crates/savehorse-glyph" }
savehorse-halo = { path = "crates/savehorse-halo" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

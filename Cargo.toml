[workspace]
resolver = "2"
members = [
    "crates/savehorse-core",
    "crates/savehorse-registry",
    "crates/savehorse-sift",
    "crates/savehorse-scout",
    "crates/savehorse-runner",
    "crates/savehorse-glyph",
    "crates/savehorse-halo",
    "crates/savehorse-iris",
    "crates/savehorse-arc",
    "crates/savehorse-revive",
    "crates/savehorse-forge",
    "crates/savehorse-morph",
    "crates/savehorse-aegis",
    "crates/savehorse-pulse",
    "crates/savehorse-flux",
    "crates/savehorse-pager",
    "apps/savehorse-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/drsamonline/savehorse"
authors = ["Dr Sohil Momin"]

[workspace.dependencies]
savehorse-core = { path = "crates/savehorse-core" }
savehorse-registry = { path = "crates/savehorse-registry" }
savehorse-sift = { path = "crates/savehorse-sift" }
savehorse-scout = { path = "crates/savehorse-scout" }
savehorse-runner = { path = "crates/savehorse-runner" }
savehorse-glyph = { path = "crates/savehorse-glyph" }
savehorse-halo = { path = "crates/savehorse-halo" }
savehorse-iris = { path = "crates/savehorse-iris" }
savehorse-arc = { path = "crates/savehorse-arc" }
savehorse-revive = { path = "crates/savehorse-revive" }
savehorse-forge = { path = "crates/savehorse-forge" }
savehorse-morph = { path = "crates/savehorse-morph" }
savehorse-aegis = { path = "crates/savehorse-aegis" }
savehorse-pulse = { path = "crates/savehorse-pulse" }
savehorse-flux = { path = "crates/savehorse-flux" }
savehorse-pager = { path = "crates/savehorse-pager" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "ico"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["simple"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

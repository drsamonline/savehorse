[package]
name = "savehorse-cli"
description = "The savehorse command line: one binary, thirteen modules, every operation reachable as `savehorse <module> <op>`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "savehorse"
path = "src/main.rs"

# Windows only: compiles the icon and version block into the .exe. Gated so
# the crate is not built on the other two platforms.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Unix only: resetting SIGPIPE, so a closed pipe is a quiet exit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
savehorse-core.workspace = true
savehorse-registry.workspace = true
savehorse-runner.workspace = true
serde.workspace = true
serde_json.workspace = true

[package]
name = "savehorse-desktop"
description = "The savehorse desktop shell: a Tauri window over the same Rust core the CLI uses."
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/drsamonline/savehorse"
authors = ["Dr Sohil Momin"]

# Detached from the parent workspace on purpose: Tauri needs system libraries
# (webkit2gtk and friends) that the CLI and the library crates do not, so it
# gets its own build in CI rather than slowing down or breaking the main one.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

savehorse-core = { path = "../../../crates/savehorse-core" }
savehorse-registry = { path = "../../../crates/savehorse-registry" }
savehorse-runner = { path = "../../../crates/savehorse-runner" }
